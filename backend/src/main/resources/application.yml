spring:
  application:
    name: tnb-dbp-backend
  datasource:
    # Defaults are for the local Docker database only. Real environments pass these as environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tnbdbp}
    username: ${DB_USER:tnb}
    password: ${DB_PASSWORD:tnb_local_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tnb:
  auth:
    otp-validity-seconds: 300
    max-failed-attempts: 3
    max-otp-resends: 3
    session-validity-seconds: 300

---
# Non-production profiles: load synthetic test customers and enable test-support endpoints.
spring:
  config:
    activate:
      on-profile: dev,sit
  flyway:
    locations: classpath:db/migration,classpath:db/testdata
